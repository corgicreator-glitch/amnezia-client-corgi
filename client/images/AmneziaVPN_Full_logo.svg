<svg width="220" height="60" viewBox="0 0 220 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Corgi face icon (left) -->
  <!-- Head -->
  <ellipse cx="30" cy="32" rx="20" ry="18" fill="#E8821A"/>
  <!-- Ear left -->
  <ellipse cx="14" cy="18" rx="8" ry="12" fill="#E8821A" transform="rotate(-15 14 18)"/>
  <!-- Ear right -->
  <ellipse cx="46" cy="18" rx="8" ry="12" fill="#E8821A" transform="rotate(15 46 18)"/>
  <!-- Ear inner left -->
  <ellipse cx="14" cy="19" rx="5" ry="8" fill="#D4580A" fill-opacity="0.5" transform="rotate(-15 14 19)"/>
  <!-- Ear inner right -->
  <ellipse cx="46" cy="19" rx="5" ry="8" fill="#D4580A" fill-opacity="0.5" transform="rotate(15 46 19)"/>
  <!-- Face cream mask -->
  <ellipse cx="30" cy="36" rx="14" ry="11" fill="#FDF0DC"/>
  <!-- Eyes -->
  <circle cx="23" cy="28" r="3" fill="#3B2215"/>
  <circle cx="37" cy="28" r="3" fill="#3B2215"/>
  <!-- Eye shine -->
  <circle cx="24.2" cy="27" r="1" fill="white" fill-opacity="0.9"/>
  <circle cx="38.2" cy="27" r="1" fill="white" fill-opacity="0.9"/>
  <!-- Nose -->
  <ellipse cx="30" cy="35" rx="4" ry="2.5" fill="#3B2215"/>
  <!-- Nostrils -->
  <circle cx="28.2" cy="35.2" r="1.1" fill="#231510"/>
  <circle cx="31.8" cy="35.2" r="1.1" fill="#231510"/>
  <!-- Mouth -->
  <path d="M27 37.5 Q30 40 33 37.5" stroke="#3B2215" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Corgi butt / tail hint at bottom right of icon -->
  <ellipse cx="50" cy="48" rx="5" ry="3" fill="#E8821A" transform="rotate(-20 50 48)"/>
  <!-- Text: CorgiVPN -->
  <text x="65" y="38" font-family="PT Root UI VF, Arial, sans-serif" font-weight="700" font-size="22" fill="#E8821A">CorgiVPN</text>
  <!-- Tagline -->
  <text x="66" y="52" font-family="PT Root UI VF, Arial, sans-serif" font-weight="400" font-size="10" fill="#A0836A">🐾 powered by AmneziaVPN</text>
</svg>
